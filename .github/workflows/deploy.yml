name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        # Required repo secrets (set with `gh secret set`; never commit values):
        #   SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, SSH_HOST_FINGERPRINT, DEPLOY_PATH
        # Fingerprint: ssh-keyscan -t ed25519 "$SSH_HOST" | ssh-keygen -lf -
        # See ADR-004 and docs/operations-cutover.md §0.
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            git pull --ff-only
            git submodule update --init --recursive
            docker compose build && docker compose up -d
            docker compose ps
            docker run --rm --network web curlimages/curl:8.5.0 \
              -sf -o /dev/null -w "smoke=%{http_code}\n" \
              http://panjigautama-hugo:8080/
