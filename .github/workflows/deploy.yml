name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        # Required repo secrets (set with `gh secret set`; never commit values):
        #   SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, DEPLOY_PATH
        # Optional: SSH_HOST_FINGERPRINT — appleboy/drone-ssh compares
        # ssh.FingerprintSHA256 to this string. Leave unset for now: exact
        # OpenSSH SHA256 values for rsa/ecdsa/ed25519 still returned
        # "fingerprint mismatch" from this host (2026-07-31). Prefer fixed IP
        # + deploy-key secrecy; revisit pinning when the action supports
        # multi-algo fingerprints. See ADR-004.
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            git pull --ff-only
            git submodule update --init --recursive
            docker compose build && docker compose up -d
            docker compose ps
            docker run --rm --network web curlimages/curl:8.5.0 \
              -sf -o /dev/null -w "smoke=%{http_code}\n" \
              http://panjigautama-hugo:8080/
