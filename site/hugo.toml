baseURL = "https://panjigautama.com"
theme = "hugo-bearblog"
title = "Panji Gautama"
author = "Panji Gautama"
copyright = "Copyright © Panji Gautama"
defaultContentLanguage = "en"
enableRobotsTXT = true

[languages.en]
  label = "English"
  locale = "en-US"
  weight = 1

[[menu.main]]
  name = "Blog"
  url = "/blog/"
  weight = 1

[[menu.main]]
  name = "About"
  url = "/about-me/"
  weight = 2

# Keep taxonomies enabled (do NOT copy Bear Blog exampleSite disableKinds)
[taxonomies]
  category = "categories"
  tag = "tags"

[permalinks]
  blog = "/:slug/"
  categories = "/categories/:slug/"
  tags = "/tags/:slug/"

[pagination]
  pagerSize = 10
  path = "page"

[params]
  description = "Notes on engineering, product, and personal growth."
  favicon = "images/favicon.png"
  title = "Panji Gautama"
  enablePostNavigator = true

[markup]
  [markup.highlight]
    style = "friendly"
    lineNos = true
    lineNumbersInTable = false
    codeFences = true
